<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ask Batman</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="panel">
      <header>
        <div>
          <strong>Batman</strong>
          <p id="status">On patrol</p>
        </div>
        <button id="close" type="button" aria-label="Close">×</button>
      </header>

      <nav>
        <button class="tab active" data-tab="chat" type="button">Ask</button>
        <button class="tab" data-tab="sleep" type="button">Sleep</button>
        <button class="tab" data-tab="settings" type="button">Settings</button>
      </nav>

      <section id="chat" class="page active">
        <div id="log" class="log">
          <div class="bubble batman">
            Speak. I am on patrol, but I can spare a moment.
          </div>
        </div>
        <form id="ask-form">
          <input id="prompt" type="text" placeholder="Ask Batman anything..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </section>

      <section id="sleep" class="page">
        <p>Need him off the screen for a while? He will hide, then come back when the nap is over.</p>
        <div class="actions">
          <button data-hours="2" type="button">Sleep 2 hours</button>
          <button data-hours="3" type="button">Sleep 3 hours</button>
          <button data-hours="4" type="button">Sleep 4 hours</button>
        </div>
        <button id="wake" class="ghost" type="button">Wake up now</button>
        <button id="quit" class="danger" type="button">Quit Batman</button>
      </section>

      <section id="settings" class="page">
        <label>
          OpenAI API key
          <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <label>
          Model
          <input id="model" type="text" value="gpt-4o-mini" />
        </label>
        <p class="hint">
          Get a key from platform.openai.com. It stays on this computer only.
          You can also set the OPENAI_API_KEY environment variable.
        </p>
        <button id="save" type="button">Save</button>
      </section>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
