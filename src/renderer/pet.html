<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desktop Batman</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <button id="hero" class="hero" type="button" aria-label="Batman">
      <span class="cape"></span>
      <span class="body">
        <span class="ear left"></span>
        <span class="ear right"></span>
        <span class="mask">
          <span class="eye left"></span>
          <span class="eye right"></span>
        </span>
        <span class="emblem" aria-hidden="true">
          <svg viewBox="0 0 24 14">
            <path
              d="M12 1.2l1.3 2.1 1.6-1.8.4 2.4 4.2-1.1 1.7 2.6-3.1.7 4.9 2.2-5.4.2-1.6 3.8L12 9.6 8 12.3 6.4 8.5.9 8.3l4.9-2.2-3.1-.7L4.4 2.8l4.2 1.1.4-2.4 1.6 1.8z"
            />
          </svg>
        </span>
        <span class="fist left"></span>
        <span class="fist right"></span>
        <span class="boot left"></span>
        <span class="boot right"></span>
      </span>
      <span class="zzz" hidden>z</span>
    </button>
    <script src="pet.js"></script>
  </body>
</html>
